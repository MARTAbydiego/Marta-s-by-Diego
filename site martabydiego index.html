<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marta Pro</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f6fa;
}

header{
    background:#ff4d79;
    padding:15px;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

nav button{
    background:none;
    border:none;
    color:white;
    font-weight:bold;
    margin:0 10px;
    cursor:pointer;
}

nav button:hover{
    opacity:0.8;
}

.container{
    padding:30px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

input, select{
    padding:8px;
    margin:5px 0;
    width:100%;
}

button.primary{
    background:#ff4d79;
    color:white;
    border:none;
    padding:10px;
    cursor:pointer;
    margin-top:10px;
}

.table{
    width:100%;
    border-collapse:collapse;
}

.table th, .table td{
    padding:10px;
    border-bottom:1px solid #eee;
}

.badge{
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
}

.pago{background:#d4edda;}
.nao{background:#f8d7da;}

.hidden{display:none;}
</style>
</head>

<body>

<header>
    <div><strong>Marta Pro</strong></div>
    <nav>
        <button onclick="showPage('inicio')">Início</button>
        <button onclick="showPage('marcacoes')">Marcações</button>
        <button onclick="showPage('clientes')">Clientes</button>
        <button onclick="showPage('servicos')">Serviços</button>
        <button onclick="showPage('financas')">Finanças</button>
        <button onclick="showPage('definicoes')">Definições</button>
    </nav>
</header>

<div class="container">

<!-- INICIO -->
<div id="inicio" class="page">
    <div class="card">
        <h2>Dashboard</h2>
        <p>Horas disponíveis este mês: <strong id="horasDisponiveis"></strong></p>
        <p>Horas ocupadas este mês: <strong id="horasOcupadas"></strong></p>
    </div>
</div>

<!-- MARCACOES -->
<div id="marcacoes" class="page hidden">
    <div class="card">
        <h2>Nova Marcação</h2>
        <input id="clienteNome" placeholder="Nome Cliente">
        <select id="servicoSelect"></select>
        <input type="date" id="dataMarcacao">
        <button class="primary" onclick="addMarcacao()">Guardar</button>
    </div>

    <div class="card">
        <h3>Lista de Marcações</h3>
        <table class="table" id="tabelaMarcacoes"></table>
    </div>
</div>

<!-- CLIENTES -->
<div id="clientes" class="page hidden">
    <div class="card">
        <h2>Novo Cliente</h2>
        <input id="novoCliente" placeholder="Nome">
        <button class="primary" onclick="addCliente()">Guardar</button>
    </div>
    <div class="card">
        <ul id="listaClientes"></ul>
    </div>
</div>

<!-- SERVICOS -->
<div id="servicos" class="page hidden">
    <div class="card">
        <h2>Novo Serviço</h2>
        <input id="servicoNome" placeholder="Nome">
        <input id="servicoPreco" placeholder="Preço">
        <input id="servicoDuracao" placeholder="Duração (horas)">
        <button class="primary" onclick="addServico()">Guardar</button>
    </div>
    <div class="card">
        <ul id="listaServicos"></ul>
    </div>
</div>

<!-- FINANCAS -->
<div id="financas" class="page hidden">
    <div class="card">
        <h2>Registos Financeiros</h2>
        <table class="table" id="tabelaFinancas"></table>
    </div>
</div>

<!-- DEFINICOES -->
<div id="definicoes" class="page hidden">
    <div class="card">
        <h2>Configuração de Horas</h2>
        <input id="horasDia" placeholder="Horas por dia">
        <input id="diasSemana" placeholder="Dias por semana">
        <button class="primary" onclick="guardarDefinicoes()">Guardar</button>
    </div>
</div>

</div>

<script>
let clientes = JSON.parse(localStorage.getItem('clientes')) || [];
let servicos = JSON.parse(localStorage.getItem('servicos')) || [];
let marcacoes = JSON.parse(localStorage.getItem('marcacoes')) || [];
let definicoes = JSON.parse(localStorage.getItem('definicoes')) || {horasDia:8,diasSemana:5};

function showPage(id){
    document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    atualizarDashboard();
}

function addCliente(){
    let nome=document.getElementById('novoCliente').value;
    clientes.push(nome);
    localStorage.setItem('clientes',JSON.stringify(clientes));
    atualizarClientes();
}

function addServico(){
    let nome=document.getElementById('servicoNome').value;
    let preco=document.getElementById('servicoPreco').value;
    let duracao=document.getElementById('servicoDuracao').value;
    servicos.push({nome,preco,duracao});
    localStorage.setItem('servicos',JSON.stringify(servicos));
    atualizarServicos();
}

function addMarcacao(){
    let cliente=document.getElementById('clienteNome').value;
    let servico=document.getElementById('servicoSelect').value;
    let data=document.getElementById('dataMarcacao').value;
    let s=servicos.find(x=>x.nome==servico);
    marcacoes.push({cliente,servico,data,preco:s.preco,duracao:s.duracao,pago:false});
    localStorage.setItem('marcacoes',JSON.stringify(marcacoes));
    atualizarMarcacoes();
}

function atualizarClientes(){
    let ul=document.getElementById('listaClientes');
    ul.innerHTML="";
    clientes.forEach(c=>ul.innerHTML+=`<li>${c}</li>`);
}

function atualizarServicos(){
    let ul=document.getElementById('listaServicos');
    let select=document.getElementById('servicoSelect');
    ul.innerHTML="";
    select.innerHTML="";
    servicos.forEach(s=>{
        ul.innerHTML+=`<li>${s.nome} - ${s.preco}€ (${s.duracao}h)</li>`;
        select.innerHTML+=`<option>${s.nome}</option>`;
    });
}

function atualizarMarcacoes(){
    let tabela=document.getElementById('tabelaMarcacoes');
    let tabelaFin=document.getElementById('tabelaFinancas');
    tabela.innerHTML="";
    tabelaFin.innerHTML="";
    marcacoes.forEach((m,i)=>{
        tabela.innerHTML+=`<tr><td>${m.cliente}</td><td>${m.servico}</td><td>${m.data}</td></tr>`;
        tabelaFin.innerHTML+=`
        <tr>
            <td>${m.cliente}</td>
            <td>${m.preco}€</td>
            <td>
                <button onclick="togglePago(${i})">
                    ${m.pago?'Pago':'Não Pago'}
                </button>
            </td>
        </tr>`;
    });
}

function togglePago(i){
    marcacoes[i].pago=!marcacoes[i].pago;
    localStorage.setItem('marcacoes',JSON.stringify(marcacoes));
    atualizarMarcacoes();
}

function guardarDefinicoes(){
    definicoes.horasDia=document.getElementById('horasDia').value;
    definicoes.diasSemana=document.getElementById('diasSemana').value;
    localStorage.setItem('definicoes',JSON.stringify(definicoes));
    atualizarDashboard();
}

function atualizarDashboard(){
    let semanas=4;
    let horasMensais=definicoes.horasDia*definicoes.diasSemana*semanas;
    let ocupadas=marcacoes.reduce((a,b)=>a+Number(b.duracao),0);
    document.getElementById('horasDisponiveis').innerText=horasMensais-ocupadas;
    document.getElementById('horasOcupadas').innerText=ocupadas;
}

atualizarClientes();
atualizarServicos();
atualizarMarcacoes();
atualizarDashboard();
</script>

</body>
</html>
